apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vitacraft
  namespace: argocd
spec:
  destination:
    namespace: 'vitacraft'
    server: 'https://kubernetes.default.svc'
  sources:
    - repoURL: 'registry.luxembourg-2.cloud.gcore.dev/59508-197526-76-infra/charts'
      chart: vitacraft
      targetRevision: 0.1.0
      helm:
        valueFiles:
          - $values/static/xavier/vitacraft/values-vitacraft.yaml
    - repoURL: 'https://github.com/apten-fors/infra.git'
      targetRevision: HEAD
      ref: values
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
