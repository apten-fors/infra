replicaCount: 1

image:
  repository: registry.luxembourg-2.cloud.gcore.dev/59508-197526-76-infra/vitacraft
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion when empty.
  tag: "v0.1.0"

imagePullSecrets:
  - name: gcore-registry-secret

fullnameOverride: "vitacraft"

containerPort: 8080

service:
  type: ClusterIP
  port: 80

httpRoute:
  annotations: {}
  # Replace this with the Gateway name used by the target cluster.
  parentRefs:
    - name: envoy-gateway-external
      namespace: envoy-gateway-system
  # An empty list accepts every hostname allowed by the Gateway listener.
  hostnames:
    - vitacraft.apten.im
  path:
    type: PathPrefix
    value: /
